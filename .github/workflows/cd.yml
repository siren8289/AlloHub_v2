
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: allohub-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

   
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e

          echo "1. SSH 디렉터리 생성"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "2. Secret 등록 여부 확인"
          test -n "$SSH_KEY" || { echo "EC2_SSH_KEY 누락"; exit 1; }
          test -n "$EC2_HOST" || { echo "EC2_HOST 누락"; exit 1; }

          echo "3. 개인키 파일 생성"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "4. 개인키 형식 검사"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          echo "5. 서버 SSH 접근 확인"
          ssh-keyscan -T 10 -H "$EC2_HOST" \
            > "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/known_hosts"
          echo "SSH 설정 완료"
