name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: allohub-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY" ]; then
            echo "::error::EC2_SSH_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            "$EC2_USER@$EC2_HOST" "
              set -e
              if [ -d /home/ubuntu/AlloHub_v2 ]; then
                cd /home/ubuntu/AlloHub_v2
              elif [ -d \$HOME/AlloHub_v2 ]; then
                cd \$HOME/AlloHub_v2
              else
                echo 'AlloHub_v2 디렉터리를 찾을 수 없습니다.'
                exit 1
              fi

              echo '최신 코드 동기화...'
              git fetch origin main
              git checkout --detach '$DEPLOY_SHA' || git checkout -f main

              echo '배포 스크립트 실행...'
              bash scripts/deploy.sh
            "
